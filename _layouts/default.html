<!DOCTYPE html>

<!-- Language -->
<html lang="en-AU">

<!-- Head -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Page title, description and social sharing tags (generated per page by jekyll-seo-tag) -->
  {% seo %}

  <!-- Business details for Google (name, address, phone) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "AccountingService",
    "name": "Athena Accounting & Advisory Services",
    "legalName": "Athena Accounting & Advisory Services Pty Ltd",
    "url": "https://www.athenaaccounting.com.au/",
    "logo": "https://www.athenaaccounting.com.au/assets/logo.svg",
    "image": "https://www.athenaaccounting.com.au/assets/merran-phegan.jpg",
    "telephone": "+61 407 211 713",
    "email": "merran@athenaaccounting.com.au",
    "address": {
      "@type": "PostalAddress",
      "streetAddress": "Level 1, 22-28 Edgeworth David Avenue",
      "addressLocality": "Hornsby",
      "addressRegion": "NSW",
      "postalCode": "2077",
      "addressCountry": "AU"
    },
    "areaServed": ["Hornsby", "Hornsby Shire", "Sydney", "Australia"],
    "founder": { "@type": "Person", "name": "Merran Phegan", "jobTitle": "Principal, Chartered Accountant" },
    "sameAs": ["https://www.linkedin.com/in/merranphegan/"]
  }
  </script>

  <!-- Style sheet -->
  <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">

  <!-- Icon -->
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/logo.svg' | relative_url }}">
</head>

<!-- Body -->
<body>
  {% include banner.html %}

  <div class="accent-extender"></div>

  <script src="{{ '/scripts/script.js' | relative_url }}" defer></script>

  <main>
    {{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
